# @package _global_
defaults:
  - override /environment: atari_breakout    
  - override /algorithm: ppo
  - override /search_space: ppo_cpu_hybrid

# https://huggingface.co/sb3/ppo-BreakoutNoFrameskip-v4
environment:
  n_envs: 8
  n_total_timesteps: 10000000

hp_config:
  minibatch_size: 256
  clip_eps: 0.1
  ent_coef: 0.01
  learning_rate: 2.5e-4
  update_epochs: 4
  n_steps: 128
  vf_coef: 0.5
  normalize_observations: False

nas_config:
  activation: relu
  hidden_size: 512

default_hyperparameter:
  running_time: 0

profiling:
  env_step_time: 0.000
  inference_time: 0.000
  grad_backprop_time: 0.000