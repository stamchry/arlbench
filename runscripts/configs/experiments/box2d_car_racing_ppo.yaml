# @package _global_
defaults:
  - override /environment: box2d_car_racing
  - override /algorithm: ppo
  - override /search_space: ppo_cpu_hybrid

environment:
  n_total_timesteps: 4000000
  n_envs: 8

hp_config:
  clip_eps: 0.18
  gamma: 0.99
  ent_coef: 0.0
  learning_rate: 0.0001
  minibatch_size: 128
  gae_lambda: 0.95
  update_epochs: 10
  n_steps: 512

nas_config:
  activation: relu
  hidden_size: 128

default_hyperparameter:
  running_time: 253

profiling:
  env_step_time: 0.00069632
  inference_time: 0.00003129
  grad_backprop_time: 0.00016668