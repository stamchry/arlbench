# @package _global_
defaults:
  - override /environment: box2d_lunar_lander    
  - override /algorithm: ppo
  - override /search_space: ppo_gpu_hybrid

environment:
  n_envs: 2048
  n_total_timesteps: 10000000

hp_config:
  clip_eps: 0.2
  ent_coef: 0.01
  gae_lambda: 0.97
  learning_rate: 0.0003
  max_grad_norm: 0.5
  minibatch_size: 1024
  n_steps: 5
  vf_coef: 0.5
  update_epochs: 4
  normalize_observations: True

nas_config:
  activation: relu
  hidden_size: 256
  num_mlp_layers: 2

default_hyperparameter:
  running_time: 253

profiling:
  env_step_time: 0.00069632
  inference_time: 0.00003129
  grad_backprop_time: 0.00016668