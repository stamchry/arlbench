# @package _global_
defaults:
  - override /environment: box2d_lunar_lander    
  - override /algorithm: ppo
  - override /search_space: ppo_cpu_hybrid

# https://huggingface.co/sb3/ppo-PongNoFrameskip-v4
environment:
  n_envs: 16
  n_total_timesteps: 1000000

hp_config:
  minibatch_size: 64
  clip_eps: 0.2
  ent_coef: 0.01
  gamma: 0.999
  gae_lambda: 0.98
  learning_rate: 0.0003
  update_epochs: 4
  n_steps: 1024
  vf_coef: 0.5
  normalize_observations: False

nas_config:
  activation: tanh
  hidden_size: 64
  num_mlp_layers: 2

default_hyperparameter:
  running_time: 253

profiling:
  env_step_time: 0.00069632
  inference_time: 0.00003129
  grad_backprop_time: 0.00016668