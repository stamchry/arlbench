seed: 0
name: ppo_cpu_algo
hyperparameters:
  hp_config.learning_rate:
    type: uniform_float
    upper: 0.1
    lower: 1.0e-06
    log: true
  hp_config.gamma_loss_rate:
    type: uniform_float
    upper: 0.05
    lower: 0.001
    default_value: 0.01
    log: True
  hp_config.gae_lambda:
    type: uniform_float
    upper: 0.9999
    lower: 0.9
    log: false
  hp_config.ent_coef:
    type: uniform_float
    upper: 0.5 
    lower: 0.0
    log: false
  hp_config.vf_coef:
    type: uniform_float
    upper: 1.0
    lower: 0.0
    default_value: 0.5
    log: false
  hp_config.minibatch_size:
    type: categorical
    choices:
      - ${hp_config.minibatch_size}
  hp_config.update_epochs:
    type: categorical
    choices:
      - ${hp_config.update_epochs}
  environment.n_total_timesteps:
    type: categorical
    choices: 
      - ${environment.n_total_timesteps}
  environment.n_envs:
    type: categorical
    choices:
      - ${environment.n_envs}
  nas_config.num_mlp_layers:
    type: categorical
    choices:
      - ${nas_config.num_mlp_layers}
  nas_config.hidden_size:
    type: categorical
    choices:
      - ${nas_config.hidden_size}