seed: 0
name: ppo_cpu_algo
hyperparameters:
  hp_config.learning_rate:
    type: uniform_float
    upper: 0.1
    lower: 1.0e-06
    log: true
  hp_config.gamma:
    type: uniform_float
    upper: 0.999
    lower: 0.95
    log: false
  hp_config.gae_lambda:
    type: uniform_float
    upper: 0.9999
    lower: 0.8
    log: false
  hp_config.ent_coef:
    type: uniform_float
    upper: 0.5 
    lower: 0.0
    log: false
  hp_config.vf_coef:
    type: uniform_float
    upper: 1.0
    lower: 0.0
    default_value: 0.5
    log: false
  hp_config.minibatch_size:
    type: constant
    value: ${hp_config.minibatch_size}
  hp_config.update_epochs:
    type: constant
    value: ${hp_config.update_epochs}
  environment.n_total_timesteps:
    type: constant
    value: ${environment.n_total_timesteps}
  environment.n_envs:
    type: constant
    value: ${environment.n_envs}
  nas_config.num_mlp_layers:
    type: constant
    value: ${nas_config.num_mlp_layers}
  nas_config.hidden_size:
    type: constant
    value: ${nas_config.hidden_size}
  profiling.env_step_time:
    type: constant
    value: ${profiling.env_step_time}
  profiling.inference_time:
    type: constant
    value: ${profiling.inference_time}
  profiling.grad_backprop_time:
    type: constant
    value: ${profiling.grad_backprop_time}